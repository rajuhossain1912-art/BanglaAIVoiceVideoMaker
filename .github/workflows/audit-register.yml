name: Automatic project audit register

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/AUDIT_REPORT.md'
      - '.github/workflows/audit-register.yml'
  workflow_run:
    workflows:
      - Backend end-to-end smoke test
      - Build and Release Android APK
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: automatic-audit-register-main
  cancel-in-progress: false

jobs:
  append-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Append verified event to permanent audit report
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = 'docs/AUDIT_REPORT.md';
            const eventName = context.eventName;
            const now = new Date().toISOString();
            let entry = '';

            if (eventName === 'push') {
              const commits = context.payload.commits || [];
              const changed = [...new Set(commits.flatMap(c => [
                ...(c.added || []), ...(c.modified || []), ...(c.removed || [])
              ]))].sort();
              entry += `\n### Source update — ${now}\n`;
              entry += `- Branch: \`main\`\n`;
              entry += `- Push range: \`${context.payload.before || 'unknown'}\` → \`${context.payload.after || context.sha}\`\n`;
              entry += `- Pushed by: ${context.actor}\n`;
              for (const c of commits) {
                entry += `- Commit: [${c.id.slice(0, 12)}](https://github.com/${owner}/${repo}/commit/${c.id}) — ${(c.message || '').split('\n')[0]}\n`;
              }
              entry += '- Changed files:\n';
              for (const file of changed) entry += `  - \`${file}\`\n`;
              if (!commits.length) entry += '- Commit details unavailable in event payload; inspect the linked commit history.\n';
              entry += '- Result: **push recorded**; this is not a test or deployment success claim.\n';
            } else {
              const run = context.payload.workflow_run;
              const conclusion = run.conclusion || 'unknown';
              const status = conclusion === 'success' ? 'সফল' :
                conclusion === 'failure' ? 'ব্যর্থ' :
                conclusion === 'cancelled' ? 'বাতিল' : conclusion;
              entry += `\n### Workflow result — ${now}\n`;
              entry += `- Workflow: **${run.name}**\n`;
              entry += `- Final result: **${status} (${conclusion})**\n`;
              entry += `- Run: [#${run.run_number}](${run.html_url})\n`;
              entry += `- Commit: [${(run.head_sha || '').slice(0, 12)}](https://github.com/${owner}/${repo}/commit/${run.head_sha})\n`;
              entry += `- Trigger: ${run.event}; branch: ${run.head_branch}; actor: ${run.actor?.login || 'unknown'}\n`;
              try {
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                  owner, repo, run_id: run.id, per_page: 100
                });
                for (const job of jobs) {
                  entry += `- Job **${job.name}**: ${job.conclusion || job.status}\n`;
                  for (const step of (job.steps || [])) {
                    entry += `  - Step ${step.number}. ${step.name}: ${step.conclusion || step.status}\n`;
                  }
                }
              } catch (error) {
                entry += `- Job detail unavailable: ${error.message}\n`;
              }
            }

            const marker = '<!-- AUTO_LOG_END -->';
            const { data: file } = await github.rest.repos.getContent({
              owner, repo, path, ref: 'main'
            });
            if (!file || Array.isArray(file) || !file.content) {
              throw new Error('Audit report file was not found; refusing to create an incomplete log.');
            }
            const current = Buffer.from(file.content, 'base64').toString('utf8');
            if (!current.includes(marker)) {
              throw new Error('Audit log marker missing; refusing to overwrite report.');
            }
            const updated = current.replace(marker, entry + '\n' + marker);
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path,
              message: `audit: record ${eventName} ${context.sha.slice(0, 7)}`,
              content: Buffer.from(updated, 'utf8').toString('base64'),
              sha: file.sha,
              branch: 'main'
            });
            core.info(`Recorded ${eventName} in ${path}`);
