          import json, tempfile
          from pathlib import Path
          from unittest.mock import patch
          from PIL import Image
          import app
          root = Path(tempfile.mkdtemp())
          calls = {"background": 0, "review": 0}
          def fake_background(script, folder, model_visual_prompt=None, **kwargs):
              calls["background"] += 1
              folder.mkdir(parents=True, exist_ok=True)
              index = calls["background"]
              image = folder / f"background-{index}.png"
              Image.new("RGB", (120, 180), (index * 55, 30 + index * 20, 70)).save(image)
              source = "licensed_contextual" if kwargs.get("force_licensed_contextual") else "ai_generated"
              (folder / "scene-source.json").write_text(json.dumps({"source": source}), encoding="utf-8")
              return image
          def fake_review(*args, **kwargs):
              calls["review"] += 1
              if calls["review"] <= 2:
                  return {"match": False, "description": "unrelated landscape"}
              return {"match": True, "description": "farmer working in a rice field"}
