          assert audit[0]["image_source"] == "licensed_contextual", audit
          assert audit[0]["semantic_status"] == "retry_matched", audit
          assert audit[0]["semantic_description"] == "farmer working in a rice field", audit
          assert summary["retry_matched"] == 1, summary
          print("Verified licensed recovery is reported as matched, not as the rejected retry's mismatch")
