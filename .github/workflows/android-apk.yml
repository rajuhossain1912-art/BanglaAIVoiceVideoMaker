name: Build and Release Android APK
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'backend/**'
      - 'Dockerfile'
      - 'render.yaml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: https://bangla-ai-voice-video-maker-api.onrender.com
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 0.3.${{ github.run_number }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug -PAPI_BASE_URL="$API_BASE_URL"
      - name: Prepare release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BanglaAIVoiceVideoMaker-v${{ env.APP_VERSION_NAME }}.apk
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BanglaAIVoiceVideoMaker-v${{ env.APP_VERSION_NAME }}-apk
          path: BanglaAIVoiceVideoMaker-v${{ env.APP_VERSION_NAME }}.apk
          if-no-files-found: error
          retention-days: 90
      - name: Publish GitHub Release with latest APK
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GH_RELEASE_TOKEN }}
          tag_name: v${{ env.APP_VERSION_NAME }}
          name: Bangla AI Voice Video Maker v${{ env.APP_VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: BanglaAIVoiceVideoMaker-v${{ env.APP_VERSION_NAME }}.apk
