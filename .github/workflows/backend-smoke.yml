name: Backend end-to-end smoke test
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'Dockerfile'
      - '.github/workflows/backend-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  video-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Build backend container
        run: docker build -t bangla-video-api-test .
      - name: Start backend
        run: docker run -d --name bangla-video-api -e AI_IMAGE_GENERATION_ENABLED=false -e LANGUAGE_MODEL_VISUAL_PLANNER_ENABLED=false -p 10000:10000 bangla-video-api-test
      - name: Wait for health endpoint
        run: |
          ready=0
          for i in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:10000/health > health.json; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Backend health endpoint did not become ready"
            docker logs bangla-video-api || true
            exit 1
          fi
          cat health.json
          python -c 'import json; d=json.load(open("health.json")); assert d["status"] == "ok", d'
      - name: Verify sampled scene timeline mapping
        run: |
          set -e
          docker exec bangla-video-api python -c 'from app import _scene_index_to_background_index as m; mapped=[m(i,100,32) for i in range(100)]; assert mapped[0] == 0, mapped; assert mapped[-1] == 31, mapped[-1]; assert mapped == sorted(mapped), mapped; assert len(set(mapped)) == 32, len(set(mapped)); assert m(50,100,32) in range(15,17), m(50,100,32); assert m(0,10,1) == 0; print("Sampled visual timeline mapping passed: 100 narration scenes cover all 32 image slots in order")'
      - name: Verify duration-based visual scene count has no fixed ceiling
        run: |
          set -e
          docker exec bangla-video-api python -c 'from app import _visual_scenes_for_interval as plan; scenes=[f"Scene {i}" for i in range(100)]; result=plan(scenes,153.1,3); assert len(result)==52, len(result); assert result[0]=="Scene 0" and result[-1]=="Scene 99", (result[0],result[-1]); unlimited=plan(scenes,150.1,3,max_scenes=0); assert len(unlimited)==51, len(unlimited); print("Duration-based visual planning passed: 52 scenes for 153.1 seconds at 3-second intervals; zero cap remains uncapped")'
      - name: Verify forced topic graphic never calls image providers
        run: |
          set -e
          docker exec bangla-video-api python -c 'import tempfile; from pathlib import Path; import app; original_ai=app.find_generated_image; original_licensed=app.find_contextual_image; app.find_generated_image=lambda *args, **kwargs: (_ for _ in ()).throw(AssertionError("AI provider called for forced topic graphic")); app.find_contextual_image=lambda *args, **kwargs: (_ for _ in ()).throw(AssertionError("licensed provider called for forced topic graphic")); temp=Path(tempfile.mkdtemp()); result=app.make_background("বাসস্ট্যান্ডে যাত্রীরা বাসের জন্য অপেক্ষা করছেন", temp, force_topic_graphic=True, variation_seed=2); assert result.is_file(), result; print("Forced topic graphic is deterministic and makes no external image-provider calls")'
      - name: Verify scene-aware visual planning
        run: |
          set -e
          docker exec bangla-video-api python -c 'import json; from app import _english_visual_prompt, _is_unrelated_map_image, _split_script_into_scenes, _parse_scene_visual_prompts; p=_english_visual_prompt("একজন দৃষ্টিপ্রতিবন্ধী মানুষ সাদা ছড়ি ব্যবহার করছেন"); assert "white cane" in p.lower(), p; assert "hospital" not in p.lower(), p; q=_english_visual_prompt("শিক্ষার্থীরা স্কুলে শিক্ষা গ্রহণ করছে"); assert "classroom" in q.lower(), q; t=_english_visual_prompt("স্মার্টফোনে স্ক্রিন রিডার ও অ্যাক্সেসিবিলিটি প্রযুক্তি ব্যবহার"); assert "world map" in t.lower() and "do not show" in t.lower(), t; assert _is_unrelated_map_image("স্মার্টফোনে স্ক্রিন রিডার ব্যবহার", "World map illustration"); assert not _is_unrelated_map_image("বিশ্ব মানচিত্র ও ভূগোল শেখা", "World map illustration"); scenes=_split_script_into_scenes(("প্রথম বিষয়।\\n\\nদ্বিতীয় বিষয়। " * 100)); assert len(scenes) >= 10, len(scenes); good=json.dumps([{"scene":1,"visual_prompt":"A realistic Bangladeshi student reading Braille in a classroom"}]); wrong=json.dumps([{"scene":2,"visual_prompt":"A realistic Bangladeshi student reading Braille in a classroom"}]); short=json.dumps([{"scene":1,"visual_prompt":"A student reading"}]); parsed=_parse_scene_visual_prompts(good,1); assert parsed and "Braille" in parsed[0], parsed; assert _parse_scene_visual_prompts("not json",1) is None; assert _parse_scene_visual_prompts(wrong,1) is None; assert _parse_scene_visual_prompts(short,1) is None; print("Scene-aware visual planning, indexed model-response validation and map-filter checks passed")'
      - name: Verify sentence-aware scene splitting
        run: |
          set -e
          docker exec bangla-video-api python -c 'from app import _split_script_into_scenes as split; first="একজন কৃষক সবুজ ধানক্ষেতে কাজ করছেন।"; second="তিনি জমির পরিচর্যা করছেন।"; scenes=split(first+" "+second,target_words=4); assert scenes == [first,second], scenes; long="বাংলাদেশের একজন পরিশ্রমী কৃষক সকালে মাঠে গিয়ে ধানের চারা রোপণ করেন এবং যত্ন নিয়ে ফসলের পরিচর্যা করেন।"; parts=split(long,target_words=4); assert " ".join(" ".join(parts).split()) == " ".join(long.split()), parts; assert all(len(part.split()) <= 8 for part in parts), parts; print("Sentence-aware visual scene splitting passed")'
      - name: Verify Bengali visual keyword inflections
        run: |
          set -e
          docker exec bangla-video-api python -c 'from app import _contains_visual_term as match; assert match("কৃষকেরা ধানক্ষেতে কাজ করছেন", "কৃষক"); assert match("বাসের যাত্রীরা অপেক্ষা করছেন", "বাস"); assert match("ডাক্তারের সঙ্গে রোগীর কথা হচ্ছে", "ডাক্তার"); assert not match("বাস্তব জীবনের গল্প", "বাস"); assert not match("বিশ্বাস ধরে রাখুন", "বাস"); print("Bengali inflection-aware visual keyword matching passed")'
      - name: Verify storyboard prompts improve licensed image search terms
        run: |
          set -e
          docker exec bangla-video-api python -c 'from app import _image_keywords; terms=_image_keywords("বাংলায় একজন কৃষক জমিতে চারা রোপণ করছেন", "A recognizable person showing a realistic documentary photograph of a farmer planting rice seedlings in a flooded paddy field, clear visible subject, natural light"); assert all(word in terms for word in ("farmer","rice","seedlings","paddy","field")), terms; generic=("photographic","photorealistic","documentary","recognizable","realistic","person","showing","visible","subject","natural","light","clear"); assert not any(word in terms for word in generic), terms; print("Licensed image search removes generic visual-style words and prioritizes concrete storyboard subjects:", terms)'
      - name: Verify licensed image search checks a broad candidate pool
        run: |
          set -e
          docker exec bangla-video-api python -c 'from app import IMAGE_SEARCH_CANDIDATE_LIMIT; assert IMAGE_SEARCH_CANDIDATE_LIMIT == 20, IMAGE_SEARCH_CANDIDATE_LIMIT; print("Licensed image search checks up to 20 candidates per source before selecting the most relevant reusable photo")'
      - name: Verify licensed photo candidates are ranked by storyboard relevance
        run: |
          set -e
          docker exec bangla-video-api python -c 'from app import _image_title_relevance_score as score, _licensed_photo_title_is_relevant as relevant_title; terms=["farmer","rice","seedlings","paddy","field"]; relevant=score("Bangladeshi farmers planting rice seedling in paddy fields",terms); generic=score("Beautiful green landscape at sunrise",terms); partial=score("Rice field landscape",terms); assert relevant > partial > generic, (relevant,partial,generic); assert score("A city skyline",terms) == 0; assert relevant_title("Bangladeshi farmers planting rice seedlings",terms); assert not relevant_title("Beautiful green landscape at sunrise",terms); assert relevant_title("Rice field landscape",terms); print("Licensed photo ranking handles plural forms and rejects generic titles without scene-subject matches")'
      - name: Verify licensed photo relevance uses provider subject tags
        run: |
          set -e
          docker exec bangla-video-api python -c 'from app import _image_metadata_relevance_score as score, _image_metadata_is_relevant as relevant; terms=["farmer","rice","seedlings","paddy","field"]; tagged=score("Untitled photograph", [{"name":"farmer"},{"name":"rice seedlings"},{"name":"paddy field"}], terms); generic=score("Untitled photograph", [{"name":"green landscape"},{"name":"sunrise"}], terms); title=score("Bangladeshi rice farmers", [{"name":"agriculture"}], terms); assert tagged >= 10 and title >= 10 and generic == 0, (tagged,title,generic); assert relevant("Untitled photograph", [{"name":"rice seedlings"}], terms); assert not relevant("Untitled photograph", [{"name":"green landscape"}], terms); print("Licensed photo relevance correctly uses subject tags when titles are generic and rejects unrelated tags")'
      - name: Verify Wikimedia photo relevance uses category metadata
        run: |
          set -e
          docker exec bangla-video-api python -c 'from app import _image_metadata_relevance_score as score, _image_metadata_is_relevant as relevant; terms=["farmer","rice","seedlings","paddy","field"]; categories=[{"name":"Agriculture in Bangladesh"},{"name":"Rice cultivation"},{"name":"Paddy fields"}]; assert score("Untitled photograph",categories,terms)>=10; assert relevant("Untitled photograph",categories,terms); assert not relevant("Untitled photograph",[{"name":"Sunsets"},{"name":"Green landscapes"}],terms); print("Wikimedia photo ranking accepts relevant category metadata and rejects unrelated categories")'
      - name: Verify voice cloning requires explicit consent
        run: |
          set -e
          code=$(curl --silent --output clone-consent.json --write-out "%{http_code}" -X POST http://127.0.0.1:10000/api/jobs -F 'script=পরীক্ষা' -F 'mode=clone' -F 'voice_clone_consent=false' -F 'audio=@README.md')
          cat clone-consent.json
          test "$code" = "400"
          grep -q "অনুমতি" clone-consent.json
          bad_offset=$(curl --silent --output offset-error.json --write-out "%{http_code}" -X POST http://127.0.0.1:10000/api/jobs -F "script=পরীক্ষা" -F "caption_offset=9")
          test "$bad_offset" = "400"
          bad_interval=$(curl --silent --output interval-error.json --write-out "%{http_code}" -X POST http://127.0.0.1:10000/api/jobs -F "script=পরীক্ষা" -F "scene_interval=7")
          test "$bad_interval" = "400"
      - name: Generate Bangla and English videos end to end
        run: |
          set -e
          for language in bangla english mixed; do
            if [ "$language" = "bangla" ]; then
              script='আসসালামু আলাইকুম। এটি বাংলা ভিডিও তৈরির পরীক্ষা।'
            elif [ "$language" = "english" ]; then
              script='Hello. This is an English video generation test.'
            else
              script='আসসালামু আলাইকুম everyone, আজকে আমরা AI voice video test করব.'
            fi
            response=$(curl --fail --silent --show-error -X POST http://127.0.0.1:10000/api/jobs -F "script=$script" -F 'mode=auto' -F 'caption_offset=0.5' -F 'scene_interval=3')
            echo "$response"
            job_id=$(echo "$response" | python -c 'import json,sys; print(json.load(sys.stdin)["id"])')
            done_job=0
            for i in $(seq 1 90); do
              status=$(curl --fail --silent --show-error "http://127.0.0.1:10000/api/jobs/$job_id")
              echo "$status"
              state=$(echo "$status" | python -c 'import json,sys; print(json.load(sys.stdin)["status"])')
              if [ "$state" = "completed" ]; then done_job=1; break; fi
              if [ "$state" = "failed" ]; then docker logs bangla-video-api; exit 1; fi
              sleep 2
            done
            if [ "$done_job" -ne 1 ]; then echo "Video generation timed out"; docker logs bangla-video-api; exit 1; fi
            curl --fail --silent --show-error "http://127.0.0.1:10000/api/jobs/$job_id/download" -o "$language.mp4"
            docker run --rm -v "$PWD":/test -w /test bangla-video-api-test ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$language.mp4"
            test -s "$language.mp4"
            curl --fail --silent --show-error "http://127.0.0.1:10000/api/jobs/$job_id/report" -o "$language-report.json"
            python -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["overall"] in ("passed_with_limits", "visual_warning"), d; assert d["checks"]["video_track"], d; assert d["checks"]["audio_track"], d; assert d["checks"]["duration_seconds"] > 0, d; assert d["checks"]["scene_count_from_generator"] > 0, d; assert d["checks"]["narration_scene_count"] > 0, d; assert d["checks"]["scene_interval_seconds"] == 3, d; assert isinstance(d["checks"]["semantic_image_review"], dict), d; assert all(k in d["checks"]["semantic_image_review"] for k in ("reviewed","matched","mismatched","retried","retry_matched","retry_mismatched","unavailable","duplicate_retry_reviewed","duplicate_retry_matched","duplicate_retry_mismatched","duplicate_retry_unavailable")), d; assert all(k in d["checks"]["image_source_counts"] for k in ("ai_generated","licensed_contextual","topic_graphic","unknown")), d; assert "AI-তৈরি ছবি" in d["report_text"], d; assert "পটভূমির ছবি" in d["report_text"], d; assert "বাক্যভিত্তিক দৃশ্য" in d["report_text"], d; assert "পরিবর্তনের বিরতি" in d["report_text"], d; assert "প্রতিবেদন" in d["report_text"], d; print("Accessible video quality report and scene details passed:", d["report_text"])' "$language-report.json"
          done
      - name: Verify Cloudflare image response decoding
        run: |
          set -e
          docker exec bangla-video-api python -c 'import base64,json; from app import _decode_cloudflare_image_response; raw=b"\\x89PNG\\r\\n\\x1a\\nexample-image-bytes"; encoded=base64.b64encode(raw).decode(); envelope=json.dumps({"result":{"image":encoded}}).encode(); assert _decode_cloudflare_image_response(raw,"image/png")==raw; assert _decode_cloudflare_image_response(envelope,"application/json")==raw; assert _decode_cloudflare_image_response(json.dumps({"image":"data:image/png;base64,"+encoded}).encode(),"application/json")==raw; print("Cloudflare raw and JSON/base64 image decoding passed")'
      - name: Verify blank image providers are rejected before selection
        run: |
          set -e
          docker exec bangla-video-api python -c 'import tempfile; from pathlib import Path; from PIL import Image; from app import _image_has_visible_content as visible; folder=Path(tempfile.mkdtemp()); black=folder/"black.png"; usable=folder/"usable.png"; Image.new("RGB",(64,64),(0,0,0)).save(black); Image.new("RGB",(64,64),(90,130,170)).save(usable); assert not visible(black); assert visible(usable); assert not visible(folder/"missing.png"); print("Blank and corrupt image files are rejected before a Cloudflare provider can be selected; visible images pass")'
      - name: Verify vision review response parsing
        run: |
          set -e
          docker exec bangla-video-api python -c 'from app import _parse_scene_match_response as parse, _extract_vision_response_text as extract; assert parse("MATCH")["match"] is True; assert parse("MISMATCH")["match"] is False; assert parse("MATCH.")["match"] is True; assert parse("MATCH: the image shows the described action")["match"] is True; assert parse("MISMATCH because the photo shows an unrelated landscape")["match"] is False; assert parse({"match":True,"confidence":0.91})["confidence"] == 0.91; assert parse({"match":"mismatch","confidence":0.88})["match"] is False; assert parse("I cannot determine") is None; assert extract({"description":"MATCH"})=="MATCH"; assert extract({"response":{"text":"MISMATCH"}})=="MISMATCH"; assert extract({"choices":[{"message":{"content":"MATCH"}}]})=="MATCH"; assert extract([{"answer":"MATCH"}])=="MATCH"; print("Vision review accepts strict labels, nested Cloudflare envelopes, and rejects ambiguous responses")'
      - name: Verify storyboard context crosses long-script batch boundaries
        run: |
          set -e
          docker exec bangla-video-api python -c 'from app import _storyboard_scene_payload as payload; scenes=[f"scene {i}" for i in range(17)]; left=payload(scenes[:8],scenes,0); middle=payload(scenes[8:16],scenes,8); right=payload(scenes[16:],scenes,16); assert left[-1]["context_after"]=="scene 8"; assert middle[0]["context_before"]=="scene 7"; assert middle[-1]["context_after"]=="scene 16"; assert right[0]["context_before"]=="scene 15"; assert middle[0]["scene"]==9; print("Storyboard context remains continuous across 8-scene model batches")'
      - name: Verify visual planner parses global scene numbers in later batches
        run: |
          set -e
          docker exec bangla-video-api python -c 'import json; from app import _parse_scene_visual_prompts as parse; data=json.dumps([{"scene":i,"visual_prompt":f"Photorealistic documentary scene number {i} with a clear visible subject"} for i in range(9,17)]); result=parse(data,8,8); assert result and len(result)==8; assert parse(data,8,0) is None; print("Visual planner correctly validates globally numbered scenes after the first 8-scene batch")'
      - name: Verify independent reviewer parses global scene numbers
        run: |
          set -e
          docker exec bangla-video-api python -c 'import json; from app import _parse_scene_visual_prompts as parse; data=json.dumps([{"scene":i,"visual_prompt":f"Photorealistic documentary scene number {i} with a clear visible subject"} for i in range(9,17)]); reviewed=parse(data,8,8); assert reviewed and reviewed[0].startswith("Photorealistic") and reviewed[-1].endswith("clear visible subject"); assert parse(data,8,0) is None; print("Independent reviewer parser accepts globally numbered scenes and rejects incorrect offsets")'
      - name: Verify storyboard reviewer preserves neighboring narration context
        run: |
          set -e
          docker exec bangla-video-api python -c 'from app import _storyboard_review_payload as payload; scenes=[f"scene {i}" for i in range(17)]; prompts=[f"photorealistic scene {i} documentary photo" for i in range(17)]; middle=payload(scenes[8:16],prompts[8:16],scenes,8); right=payload(scenes[16:],prompts[16:],scenes,16); assert middle[0]["context_before"]=="scene 7"; assert middle[-1]["context_after"]=="scene 16"; assert middle[0]["scene"]==9; assert right[0]["context_before"]=="scene 15"; assert middle[0]["proposed_visual_prompt"]==prompts[8]; print("Independent storyboard reviewer receives neighboring narration across batch boundaries")'
      - name: Verify repeated images request a distinct photo composition
        run: |
          set -e
          docker exec bangla-video-api python -c 'from app import _distinct_scene_retry_prompt as retry; p=retry("A Bangladeshi farmer working in a rice field", "একজন কৃষক ধানক্ষেতে কাজ করছেন"); assert "different photographic composition" in p; assert "camera angle" in p; assert "Do not reuse" in p; assert "farmer" in p.lower(); print("Repeated-image retry preserves the narrated subject and requests a different photo composition")'
      - name: Verify vision review skips local fallback graphics
        run: |
          set -e
          docker exec bangla-video-api python -c 'from app import _should_semantically_review_image_source as should; assert should("ai_generated"); assert should("licensed_contextual"); assert should("licensed_contextual_after_rejected_ai"); assert not should("topic_graphic"); assert not should("unknown"); print("Vision review is reserved for photographic sources; local fallback graphics do not consume vision inference")'
      - name: Verify duplicate replacement photos receive sampled semantic review
        run: |
          set -e
          docker exec bangla-video-api python -c 'from app import _should_review_duplicate_retry as should; selected={0,2}; assert should(0,selected,"ai_generated"); assert should(2,selected,"licensed_contextual"); assert not should(1,selected,"ai_generated"); assert not should(0,selected,"topic_graphic"); assert not should(0,selected,"unknown"); print("Duplicate replacement photos are semantically reviewed only for selected photographic scenes")'
      - name: Show backend logs on failure
        if: failure()
        run: docker logs bangla-video-api || true
