name: Pull Request Backend Check

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/pr-backend-check.yml"
      - "Dockerfile"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check backend Python syntax
        run: python -m py_compile backend/app.py
      - name: Build production Docker image
        run: docker build --pull -t bangla-video-pr-test .
      - name: Run all backend tests inside production Docker image
        run: docker run --rm --workdir /service --entrypoint python bangla-video-pr-test -m unittest discover -s backend/tests -v
