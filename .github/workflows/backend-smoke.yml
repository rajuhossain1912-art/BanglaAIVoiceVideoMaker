name: Backend end-to-end smoke test
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'Dockerfile'
      - '.github/workflows/backend-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: backend-smoke-${{ github.ref }}
  cancel-in-progress: false
jobs:
  video-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Build backend container
        run: docker build -t bangla-video-api-test .
      - name: Run backend unit tests
        run: |
          docker run --rm --workdir /service --entrypoint python bangla-video-api-test -m unittest discover -s backend/tests -v
      - name: Start backend
        run: docker run -d --name bangla-video-api -e AI_IMAGE_GENERATION_ENABLED=false -e LANGUAGE_MODEL_VISUAL_PLANNER_ENABLED=false -p 10000:10000 bangla-video-api-test
      - name: Wait for health endpoint
        run: |
          ready=0
          for i in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:10000/health > health.json; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Backend health endpoint did not become ready"
            docker logs bangla-video-api || true
            exit 1
          fi
          cat health.json
          python -c 'import json; d=json.load(open("health.json")); assert d["status"] == "ok", d'
      - name: Verify Bengali and English Tesseract language packs
        run: |
          set -e
          docker exec bangla-video-api tesseract --list-langs > tesseract-languages.txt
          grep -qx 'ben' tesseract-languages.txt
          grep -qx 'eng' tesseract-languages.txt
          echo "Tesseract Bengali and English language packs are installed"
      - name: Verify voice chat reuses the existing AI token
        run: |
          docker exec bangla-video-api python - <<'PY'
          import contextlib, io, json, os
          from unittest.mock import patch
          import app
          payload = {"result": {"response": "আপনাকে কীভাবে সাহায্য করতে পারি?"}}
          with patch.dict(os.environ, {"CLOUDFLARE_ACCOUNT_ID": "test-account", "CLOUDFLARE_AI_API_TOKEN": "existing-token", "CLOUDFLARE_AI_MODEL": "@cf/meta/llama-3.2-3b-instruct"}), patch.object(
              app.urllib.request, "urlopen",
              return_value=contextlib.nullcontext(io.BytesIO(json.dumps(payload, ensure_ascii=False).encode("utf-8")))
          ) as mocked:
              result = app.chat({"messages": [{"role": "user", "content": "তুমি কী করতে পারো?"}]})
              assert result["reply"] == "আপনাকে কীভাবে সাহায্য করতে পারি?", result
              request = mocked.call_args.args[0]
              assert request.get_header("Authorization") == "Bearer existing-token"
              sent = json.loads(request.data.decode("utf-8"))
              assert sent["messages"][-1]["content"] == "তুমি কী করতে পারো?", sent
          print("Voice chat uses the existing Cloudflare token and returns the model reply")
          with patch.dict(os.environ, {"CLOUDFLARE_ACCOUNT_ID": "test-account", "CLOUDFLARE_AI_API_TOKEN": "existing-token"}), patch.object(
              app.urllib.request, "urlopen",
              side_effect=app.urllib.error.HTTPError("https://api.cloudflare.com", 429, "Too Many Requests", {}, None)
          ) as mocked:
              result = app.chat({"messages": [{"role": "user", "content": "হায় কেমন আছো"}]})
              assert result["provider"] == "অফলাইন বিকল্প উত্তর", result
              assert "আমি ভালো আছি" in result["reply"], result
              assert mocked.call_count == 1, mocked.call_count
          print("Cloudflare 429 greeting fallback responds locally and stops retrying rate-limited models")
          with patch.dict(os.environ, {"CLOUDFLARE_ACCOUNT_ID": "test-account", "CLOUDFLARE_AI_API_TOKEN": "existing-token"}), patch.object(
              app.urllib.request, "urlopen", side_effect=TimeoutError("provider timed out")
          ) as mocked:
              result = app.chat({"messages": [{"role": "user", "content": "হায় কেমন আছো"}]})
              assert result["provider"] == "অফলাইন বিকল্প উত্তর", result
              assert "আমি ভালো আছি" in result["reply"], result
              assert mocked.call_count == 1, mocked.call_count
          print("Cloudflare timeout greeting fallback responds locally and stops retrying")
          PY
      - name: Verify Bangla and English audio transcript comparison
        run: |
          docker exec bangla-video-api python -c 'from app import _compare_script_transcript as compare; bn="বাংলাদেশের কৃষক ধান চাষ করেন"; assert compare(bn,bn)["status"]=="matched"; assert compare(bn,"বাংলাদেশের কৃষক ধান চাষ করেন।")["status"]=="matched"; assert compare(bn,"ধান চাষ করেন বাংলাদেশের কৃষক")["status"]=="mismatch"; assert compare("The farmer grows rice","The farmer grows rice")["status"]=="matched"; assert compare(bn,"")["status"]=="unavailable"; partial=compare(bn,"বাংলাদেশের কৃষক ধান কাটেন"); assert partial["status"] in ("review_required","mismatch"), partial; print("Bangla/English transcript comparison, punctuation normalization, word-order mismatch and unavailable states passed")'
      - name: Verify subtitle timing diagnostics never claim word-level ASR alignment
        run: |
          docker exec bangla-video-api python - <<'PY'
          from pathlib import Path
          from types import SimpleNamespace
          from unittest.mock import patch
          import app
          estimated, method = app.sentence_timing_spans(None, ["প্রথম বাক্য", "দ্বিতীয় বাক্য"], 10.0, return_method=True)
          assert method == "estimated_proportional", method
          assert len(estimated) == 2 and estimated[0][0] == 0.0 and estimated[-1][1] == 10.0, estimated
          fake = SimpleNamespace(stderr=b"silence_start: 4.00\nsilence_end: 4.40\n")
          with patch.object(app.subprocess, "run", return_value=fake):
              aligned, method = app.sentence_timing_spans(Path("/tmp/audio.wav"), ["প্রথম বাক্য", "দ্বিতীয় বাক্য"], 10.0, return_method=True)
          assert method == "audio_silence_boundaries", method
          assert abs(aligned[0][1] - 4.2) < 0.01, aligned
          assert app.sentence_timing_spans(None, ["একটি বাক্য"], 3.0, return_method=True)[1] == "estimated_proportional"
          print("Subtitle timing reports distinguish silence-assisted sentence estimates from proportional estimates; neither claims ASR word timestamps")
          PY
      - name: Verify bounded licensed image search cache
        run: |
          set -e
          docker exec bangla-video-api python - <<'PY'
          from unittest.mock import patch
          import app
          app._IMAGE_SEARCH_CACHE.clear()
          app._image_search_cache_set("openverse", "train railway", [])
          assert app._image_search_cache_get("openverse", "train railway") == []
          with patch.object(app.time, "monotonic", return_value=100.0):
              app._image_search_cache_set("wikimedia", "farmer rice", [{"id": 1}])
          with patch.object(app.time, "monotonic", return_value=100.0 + app.IMAGE_SEARCH_CACHE_TTL_SECONDS + 1):
              assert app._image_search_cache_get("wikimedia", "farmer rice") is None
          app._IMAGE_SEARCH_CACHE.clear()
          for index in range(app.IMAGE_SEARCH_CACHE_MAX_ENTRIES + 5):
              app._image_search_cache_set("openverse", str(index), [])
          assert len(app._IMAGE_SEARCH_CACHE) == app.IMAGE_SEARCH_CACHE_MAX_ENTRIES
          assert app._image_search_cache_get("openverse", "0") is None
          app._IMAGE_SEARCH_CACHE.clear()
          print("Licensed image cache passed: successful empty results, expiry, and bounded entry count")
          PY
      - name: Verify licensed photo searches include subject synonyms
        run: |
          set -e
          docker exec bangla-video-api python - <<'PY'
          import app
          farmer = app._image_search_query_variants(["farmer", "rice", "field", "harvesting"])
          assert farmer[0] == "farmer rice field harvesting", farmer
          assert len(farmer) == 2, farmer
          assert "agriculture" in farmer[1] and "paddy" in farmer[1], farmer
          train = app._image_search_query_variants(["train", "railway", "station"])
          assert any("locomotive" in query for query in train), train
          print("Licensed photo query variants preserve original scene terms and add relevant subject synonyms")
          PY
      - name: Verify image-search keywords prioritize scene subjects over camera wording
        run: |
          set -e
          docker exec bangla-video-api python - <<'PY'
          import app
          keywords = app._image_keywords(
              "একজন কৃষক ধানক্ষেতে ফসল কাটছেন",
              "Close-up documentary photograph, camera angle, a Bangladeshi farmer harvesting rice in a green field",
          )
          assert "farmer" in keywords and "rice" in keywords and "harvesting" in keywords, keywords
          assert not any(word in keywords for word in ("close", "camera", "angle", "background", "composition", "portrait", "lens", "lighting")), keywords
          print("Photo search keywords prioritize the narrated farmer and rice harvest, not camera/composition wording")
          PY
      - name: Verify Openverse reuses successful cached provider results
        run: |
          set -e
          docker exec bangla-video-api python - <<'PY'
          import contextlib
          import io
          import tempfile
          from pathlib import Path
          from unittest.mock import patch
          import app
          calls = []
          def fake_urlopen(request, timeout=6):
              calls.append(request.full_url)
              return contextlib.nullcontext(io.BytesIO(b'{"results": []}'))
          with patch.object(app, "_IMAGE_SEARCH_CACHE", {}), patch.object(
              app.urllib.request, "urlopen", side_effect=fake_urlopen
          ):
              folder = Path(tempfile.mkdtemp())
              first = app.find_openverse_image(
                  "একজন কৃষক ধানক্ষেতে কাজ করছেন",
                  folder,
                  "farmer rice field harvesting",
              )
              first_call_count = len(calls)
              second = app.find_openverse_image(
                  "একজন কৃষক ধানক্ষেতে কাজ করছেন",
                  folder,
                  "farmer rice field harvesting",
              )
              assert first == (None, ""), first
              assert second == (None, ""), second
              assert first_call_count > 0, first_call_count
              assert len(calls) == first_call_count, (first_call_count, len(calls))
          print("Openverse successful empty responses are cached; repeat scene searches make no provider requests")
          PY
      - name: Verify sampled scene timeline mapping
        run: |
          set -e
          docker exec bangla-video-api python -c 'from app import _scene_index_to_background_index as m; mapped=[m(i,100,32) for i in range(100)]; assert mapped[0] == 0, mapped; assert mapped[-1] == 31, mapped[-1]; assert mapped == sorted(mapped), mapped; assert len(set(mapped)) == 32, len(set(mapped)); assert m(50,100,32) in range(15,17), m(50,100,32); assert m(0,10,1) == 0; print("Sampled visual timeline mapping passed: 100 narration scenes cover all 32 image slots in order")'
      - name: Verify duration-based visual scene count has no fixed ceiling
        run: |
          set -e
          docker exec bangla-video-api python -c 'from app import _visual_scenes_for_interval as plan; scenes=[f"Scene {i}" for i in range(100)]; result=plan(scenes,153.1,3); assert len(result)==52, len(result); assert result[0]=="Scene 0" and result[-1]=="Scene 99", (result[0],result[-1]); unlimited=plan(scenes,150.1,3,max_scenes=0); assert len(unlimited)==51, len(unlimited); print("Duration-based visual planning passed: 52 scenes for 153.1 seconds at 3-second intervals; zero cap remains uncapped")'
      - name: Verify forced topic graphic never calls image providers
        run: |
          set -e
          docker exec bangla-video-api python -c 'import tempfile; from pathlib import Path; import app; original_ai=app.find_generated_image; original_licensed=app.find_contextual_image; app.find_generated_image=lambda *args, **kwargs: (_ for _ in ()).throw(AssertionError("AI provider called for forced topic graphic")); app.find_contextual_image=lambda *args, **kwargs: (_ for _ in ()).throw(AssertionError("licensed provider called for forced topic graphic")); temp=Path(tempfile.mkdtemp()); result=app.make_background("বাসস্ট্যান্ডে যাত্রীরা বাসের জন্য অপেক্ষা করছেন", temp, force_topic_graphic=True, variation_seed=2); assert result.is_file(), result; print("Forced topic graphic is deterministic and makes no external image-provider calls")'
      - name: Verify rejected AI photos can recover with licensed contextual photos
        run: |
          set -e
          docker exec bangla-video-api python - <<'PY'
          import json, tempfile
          from pathlib import Path
          from PIL import Image
          import app
          folder = Path(tempfile.mkdtemp())
          candidate = folder / "licensed-candidate.jpg"
          Image.new("RGB", (160, 240), (95, 145, 105)).save(candidate)
          original = app.find_contextual_image
          try:
              app.find_contextual_image = lambda *args, **kwargs: (candidate, "Licensed test photo")
              output = app.make_background(
                  "একজন কৃষক ধানক্ষেতে কাজ করছেন",
                  folder,
                  "A Bangladeshi farmer working in a rice paddy field",
                  force_licensed_contextual=True,
              )
              metadata = json.loads((folder / "scene-source.json").read_text(encoding="utf-8"))
              assert output.is_file(), output
              assert metadata["source"] == "licensed_contextual", metadata
              assert metadata["provider"] == "openverse_or_wikimedia", metadata
              print("Rejected AI photo recovery selects and records a licensed contextual photo before topic-graphic fallback")
          finally:
              app.find_contextual_image = original
          PY
      - name: Verify scene-aware visual planning
        run: |
          set -e
          docker exec bangla-video-api python -c 'import json; from app import _english_visual_prompt, _is_unrelated_map_image, _split_script_into_scenes, _parse_scene_visual_prompts; p=_english_visual_prompt("একজন দৃষ্টিপ্রতিবন্ধী মানুষ সাদা ছড়ি ব্যবহার করছেন"); assert "white cane" in p.lower(), p; assert "hospital" not in p.lower(), p; q=_english_visual_prompt("শিক্ষার্থীরা স্কুলে শিক্ষা গ্রহণ করছে"); assert "classroom" in q.lower(), q; t=_english_visual_prompt("স্মার্টফোনে স্ক্রিন রিডার ও অ্যাক্সেসিবিলিটি প্রযুক্তি ব্যবহার"); assert "world map" in t.lower() and "do not show" in t.lower(), t; assert _is_unrelated_map_image("স্মার্টফোনে স্ক্রিন রিডার ব্যবহার", "World map illustration"); assert not _is_unrelated_map_image("বিশ্ব মানচিত্র ও ভূগোল শেখা", "World map illustration"); scenes=_split_script_into_scenes(("প্রথম বিষয়।\\n\\nদ্বিতীয় বিষয়। " * 100)); assert len(scenes) >= 10, len(scenes); good=json.dumps([{"scene":1,"visual_prompt":"A realistic Bangladeshi student reading Braille in a classroom"}]); wrong=json.dumps([{"scene":2,"visual_prompt":"A realistic Bangladeshi student reading Braille in a classroom"}]); short=json.dumps([{"scene":1,"visual_prompt":"A student reading"}]); parsed=_parse_scene_visual_prompts(good,1); assert parsed and "Braille" in parsed[0], parsed; assert _parse_scene_visual_prompts("not json",1) is None; assert _parse_scene_visual_prompts(wrong,1) is None; assert _parse_scene_visual_prompts(short,1) is None; print("Scene-aware visual planning, indexed model-response validation and map-filter checks passed")'
      - name: Verify sentence-aware scene splitting
        run: |
          set -e
          docker exec bangla-video-api python -c 'from app import _split_script_into_scenes as split; first="একজন কৃষক সবুজ ধানক্ষেতে কাজ করছেন।"; second="তিনি জমির পরিচর্যা করছেন।"; scenes=split(first+" "+second,target_words=4); assert scenes == [first,second], scenes; long="বাংলাদেশের একজন পরিশ্রমী কৃষক সকালে মাঠে গিয়ে ধানের চারা রোপণ করেন এবং যত্ন নিয়ে ফসলের পরিচর্যা করেন।"; parts=split(long,target_words=4); assert " ".join(" ".join(parts).split()) == " ".join(long.split()), parts; assert all(len(part.split()) <= 8 for part in parts), parts; print("Sentence-aware visual scene splitting passed")'
      - name: Verify Bengali visual keyword inflections
        run: |
          set -e
          docker exec bangla-video-api python -c 'from app import _contains_visual_term as match; assert match("কৃষকেরা ধানক্ষেতে কাজ করছেন", "কৃষক"); assert match("বাসের যাত্রীরা অপেক্ষা করছেন", "বাস"); assert match("ডাক্তারের সঙ্গে রোগীর কথা হচ্ছে", "ডাক্তার"); assert not match("বাস্তব জীবনের গল্প", "বাস"); assert not match("বিশ্বাস ধরে রাখুন", "বাস"); print("Bengali inflection-aware visual keyword matching passed")'
      - name: Verify storyboard prompts improve licensed image search terms
        run: |
          set -e
          docker exec bangla-video-api python -c 'from app import _image_keywords; terms=_image_keywords("বাংলায় একজন কৃষক জমিতে চারা রোপণ করছেন", "A recognizable person showing a realistic documentary photograph of a farmer planting rice seedlings in a flooded paddy field, clear visible subject, natural light"); assert all(word in terms for word in ("farmer","rice","seedlings","paddy","field")), terms; generic=("photographic","photorealistic","documentary","recognizable","realistic","person","showing","visible","subject","natural","light","clear"); assert not any(word in terms for word in generic), terms; print("Licensed image search removes generic visual-style words and prioritizes concrete storyboard subjects:", terms)'
      - name: Verify licensed image search broadens zero-result queries
        run: |
          set -e
          docker exec bangla-video-api python -c 'from app import _image_search_query_variants as variants; q=variants(["farmer","rice","seedlings","paddy","field","planting"]); assert q[0]=="farmer rice seedlings paddy field planting", q; assert q[1] == "farmer rice seedlings paddy" and "agriculture" in q[2], q; assert len(q)==3 and len(set(q))==3, q; print("Licensed photo search tries a full scene query and two narrower subject queries:", q)'
      - name: Verify Openverse continues after a failed photo download
        run: |
          set -e
          docker exec bangla-video-api python - <<'PY'
          import json, tempfile
          from pathlib import Path
          from unittest.mock import patch
          import app
          class Response:
              def __enter__(self): return self
              def __exit__(self, *args): return False
              def read(self, limit=-1):
                  return json.dumps({"results":[
                      {"id":"best","title":"Farmer rice seedlings paddy field planting","tags":[],"license":"by","thumbnail":"https://example.test/best.jpg","creator":"Test","foreign_landing_url":"https://example.test/best","license_url":"https://creativecommons.org/licenses/by/4.0/"},
                      {"id":"backup","title":"Farmer rice planting","tags":[],"license":"cc0","thumbnail":"https://example.test/backup.jpg","creator":"Test","foreign_landing_url":"https://example.test/backup","license_url":"https://creativecommons.org/publicdomain/zero/1.0/"}
                  ]}).encode()
          downloaded=[]
          def fake_download(url, folder, filename, credit):
              downloaded.append(url)
              if len(downloaded)==1:
                  return None, ""
              target=folder/"backup.jpg"
              target.write_bytes(b"checked-test-image")
              return target, credit
          with tempfile.TemporaryDirectory() as tmp,                patch.object(app, "_image_keywords", return_value=["farmer","rice","seedlings","paddy","field","planting"]),                patch.object(app.urllib.request, "urlopen", side_effect=lambda *a, **k: Response()),                patch.object(app, "_download_checked_image", side_effect=fake_download),                patch.object(app, "_is_unrelated_map_image", return_value=False):
              image, credit=app.find_openverse_image("কৃষক ধান রোপণ করছেন", Path(tmp), "farmer planting rice")
              assert image and image.name=="backup.jpg", image
              assert len(downloaded)>=2, downloaded
              print("Openverse continues to the next relevant licensed photo after the first download fails")
          PY
      - name: Verify Wikimedia continues after a failed photo download
        run: |
          set -e
          docker exec bangla-video-api python - <<'PY'
          import json, tempfile
          from pathlib import Path
          from unittest.mock import patch
          import app
          pages = {
              "1": {"pageid": 1, "title": "File:Farmer rice seedlings paddy field planting.jpg", "categories": [{"title": "Category:Rice cultivation"}, {"title": "Category:Agriculture in Bangladesh"}], "imageinfo": [{"thumburl": "https://example.test/best.jpg", "extmetadata": {"LicenseShortName": {"value": "CC BY 4.0"}, "Artist": {"value": "Test"}}}]},
              "2": {"pageid": 2, "title": "File:Farmer rice planting.jpg", "categories": [{"title": "Category:Rice cultivation"}], "imageinfo": [{"thumburl": "https://example.test/backup.jpg", "extmetadata": {"LicenseShortName": {"value": "CC0"}, "Artist": {"value": "Test"}}}]}
          }
          class Response:
              def __init__(self, payload): self.payload = payload
              def __enter__(self): return self
              def __exit__(self, *args): return False
              def read(self, limit=-1): return json.dumps(self.payload).encode()
          responses = [Response({"results": []}) for _ in range(3)] + [Response({"query": {"pages": pages}}) for _ in range(3)]
          downloaded = []
          def fake_download(url, folder, filename, credit):
              downloaded.append(url)
              if len(downloaded) == 1: return None, ""
              target = folder / "backup.jpg"
              target.write_bytes(b"checked-test-image")
              return target, credit
          with tempfile.TemporaryDirectory() as tmp, \
               patch.object(app, "_image_keywords", return_value=["farmer", "rice", "seedlings", "paddy", "field", "planting"]), \
               patch.object(app.urllib.request, "urlopen", side_effect=responses), \
               patch.object(app, "_download_checked_image", side_effect=fake_download), \
               patch.object(app, "_is_unrelated_map_image", return_value=False):
              image, credit = app.find_contextual_image("কৃষক ধান রোপণ করছেন", Path(tmp), "farmer planting rice")
              assert image and image.name == "backup.jpg", image
              assert len(downloaded) >= 2, downloaded
              print("Wikimedia continues to the next relevant reusable photo after the first download fails")
          PY
      - name: Verify licensed image search checks a broad candidate pool
        run: |
          set -e
          docker exec bangla-video-api python -c 'from app import IMAGE_SEARCH_CANDIDATE_LIMIT; assert IMAGE_SEARCH_CANDIDATE_LIMIT == 20, IMAGE_SEARCH_CANDIDATE_LIMIT; print("Licensed image search checks up to 20 candidates per source before selecting the most relevant reusable photo")'
      - name: Verify licensed photo candidates are ranked by storyboard relevance
        run: |
          set -e
