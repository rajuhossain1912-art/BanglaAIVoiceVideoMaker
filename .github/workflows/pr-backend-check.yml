name: Pull Request Backend Check

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/pr-backend-check.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check backend Python syntax
        run: python -m py_compile backend/app.py
