name: Verified Android release
on:
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (for example v0.1.0)
        required: true
        default: v0.1.0
        type: string
permissions:
  contents: write
jobs:
  verify-backend-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      API_BASE_URL: https://bangla-ai-voice-video-maker-api.onrender.com
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || 'v0.1.0' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Build backend container
        run: docker build -t bangla-video-api-release .
      - name: Start backend
        run: docker run -d --name bangla-video-api-release -p 10000:10000 bangla-video-api-release
      - name: Wait for health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:10000/health > health.json; then break; fi
            sleep 2
          done
          cat health.json
          python -c 'import json; d=json.load(open("health.json")); assert d["status"] == "ok", d'
      - name: Test Bangla, English and mixed-language video generation
        run: |
          set -e
          for language in bangla english mixed; do
            if [ "$language" = "bangla" ]; then
              script='আসসালামু আলাইকুম। এটি বাংলা ভিডিও তৈরির পরীক্ষা।'
            elif [ "$language" = "english" ]; then
              script='Hello. This is an English video generation test.'
            else
              script='আসসালামু আলাইকুম everyone, আজকে আমরা AI voice video test করব.'
            fi
            response=$(curl --fail --silent --show-error -X POST http://127.0.0.1:10000/api/jobs -F "script=$script" -F 'mode=auto')
            job_id=$(echo "$response" | python -c 'import json,sys; print(json.load(sys.stdin)["id"])')
            done_job=0
            for i in $(seq 1 90); do
              status=$(curl --fail --silent --show-error "http://127.0.0.1:10000/api/jobs/$job_id")
              state=$(echo "$status" | python -c 'import json,sys; print(json.load(sys.stdin)["status"])')
              if [ "$state" = "completed" ]; then done_job=1; break; fi
              if [ "$state" = "failed" ]; then echo "$status"; docker logs bangla-video-api-release; exit 1; fi
              sleep 2
            done
            test "$done_job" -eq 1
            curl --fail --silent --show-error "http://127.0.0.1:10000/api/jobs/$job_id/download" -o "$language.mp4"
            test -s "$language.mp4"
            docker run --rm -v "$PWD":/test -w /test bangla-video-api-release ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$language.mp4"
          done
      - name: Verify voice cloning against external demo using synthetic test audio
        run: |
          set -e
          docker exec bangla-video-api-release espeak-ng -v bn -s 140 -w /tmp/synthetic-reference.wav 'এটি কৃত্রিম পরীক্ষামূলক কণ্ঠের নমুনা'
          docker cp bangla-video-api-release:/tmp/synthetic-reference.wav synthetic-reference.wav
          response=$(curl --fail --silent --show-error -X POST http://127.0.0.1:10000/api/jobs \
            -F 'script=এটি নিজের কণ্ঠের পরীক্ষামূলক অডিও।' \
            -F 'mode=clone' -F 'voice_clone_consent=true' \
            -F 'audio=@synthetic-reference.wav')
          echo "$response"
          job_id=$(echo "$response" | python -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          done_job=0
          for i in $(seq 1 180); do
            status=$(curl --fail --silent --show-error "http://127.0.0.1:10000/api/jobs/$job_id")
            echo "$status"
            state=$(echo "$status" | python -c 'import json,sys; print(json.load(sys.stdin)["status"])')
            if [ "$state" = "completed" ]; then done_job=1; break; fi
            if [ "$state" = "failed" ]; then echo "$status"; docker logs bangla-video-api-release; exit 1; fi
            sleep 2
          done
          if [ "$done_job" -ne 1 ]; then echo 'Voice-clone test timed out'; docker logs bangla-video-api-release; exit 1; fi
          curl --fail --silent --show-error "http://127.0.0.1:10000/api/jobs/$job_id/download" -o clone-test.mp4
          test -s clone-test.mp4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build Android debug APK
        run: gradle --no-daemon assembleDebug -PAPI_BASE_URL="$API_BASE_URL"
      - name: Give APK a simple download filename
        run: cp app/build/outputs/apk/debug/app-debug.apk app-release.apk
      - name: Publish tested APK as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Bangla AI Voice Video Maker ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: app-release.apk
          body: |
            ## অ্যাপ ডাউনলোড
            
            **সহজে ডাউনলোড করতে নিচের লিংকে চাপ দিন:**
            
            [**app-release.apk — Android অ্যাপ ডাউনলোড করুন**](https://github.com/rajuhossain1912-art/BanglaAIVoiceVideoMaker/releases/download/v0.1.0/app-release.apk)
            
            অথবা নিচের Assets অংশে **app-release.apk** ফাইলটি নির্বাচন করুন।
            
            এটি ফোনে বাস্তব পরীক্ষার জন্য তৈরি Android APK; Play Store-এর production-signed সংস্করণ নয়। বাংলা, ইংরেজি, মিশ্র ভাষার ভিডিও এবং পরীক্ষামূলক voice-cloning smoke test সফল হওয়ার পরই রিলিজ তৈরি করা হয়।
            
            **কণ্ঠ নকলের সতর্কতা:** এটি বাইরের বিনামূল্যের Hugging Face ডেমোর ওপর নির্ভরশীল। এর প্রাপ্যতা, মান এবং অডিও/লেখা সংরক্ষণের নীতি নিশ্চিত নয়। শুধু নিজের অথবা স্পষ্ট অনুমতি থাকা কণ্ঠ ব্যবহার করুন।
            
            বিষয়ভিত্তিক উপযুক্ত লাইসেন্সের ছবি না পেলে অ্যাপ গ্রাফিক ব্যাকগ্রাউন্ড ব্যবহার করে। সাবটাইটেলের শব্দ-হাইলাইটের সময় আনুমানিক।
